name = "maglean"
version = "0.1.0"
keywords = ["math", "bioinformatics", "metagenomics", "mags", "formal-verification"]
defaultTargets = ["MAGLean", "maglean"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0"

[[lean_lib]]
name = "MAGLean"

[[lean_exe]]
name = "maglean"
root = "Main"
